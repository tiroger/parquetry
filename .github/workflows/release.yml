name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true
      publish:
        description: "Publish (release assets, tap, bucket). Off = dry run: build, sign, notarize, keep the files as workflow artifacts."
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Don't bundle DuckDB extensions: they carry DuckDB's own signature, which
  # notarization rejects even inside archives. DuckDB installs httpfs on first
  # S3/HTTP use. See packaging/README.md.
  DUCKDB_EXT_LAYOUT: none

jobs:
  release:
    name: Build, sign, notarize, publish
    # Opt-in: set the repository variable AUTOMATED_RELEASES=true once the
    # signing secrets exist. Until then macOS releases are built and published by
    # hand (see packaging/README.md); the Windows job below runs regardless.
    # Manual runs (dry runs included) always build macOS.
    if: vars.AUTOMATED_RELEASES == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Tag pushes publish; manual runs only when asked to.
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # CFBundleVersion = commit count

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: universal-release

      - name: Check tag matches Cargo.toml version
        run: |
          version="$(awk '/^\[/{s=($0=="[workspace.package]")} s&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/parquetry-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put it first in the search list, keeping the existing keychains.
          existing=()
          while IFS= read -r kc; do
            kc="$(sed -e 's/^ *"//' -e 's/" *$//' <<<"$kc")"
            if [ -n "$kc" ]; then existing+=("$kc"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          rm -f "$CERT"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::no 'Developer ID Application' identity in MACOS_CERTIFICATE_P12"
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app bundle
        run: UNIVERSAL=1 scripts/bundle.sh

      - name: Package zip + dmg
        run: scripts/package.sh

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize.sh

      - name: Generate update feed (Sparkle appcast)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY not set; publishing without appcast.xml (installed apps won't see this update)"
            exit 0
          fi
          scripts/appcast.sh "target/dist/Parquetry-$VERSION.zip"

      - name: Keep the files (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parquetry-macos-${{ env.TAG }}
          path: |
            target/dist/*.zip
            target/dist/*.dmg
            target/dist/SHA256SUMS
            target/dist/appcast.xml
          retention-days: 7

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(
            "target/dist/Parquetry-$VERSION.zip"
            "target/dist/Parquetry-$VERSION.dmg"
            "target/dist/SHA256SUMS"
          )
          if [ -f target/dist/appcast.xml ]; then files+=("target/dist/appcast.xml"); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes=(--generate-notes)
            if [ -f "packaging/release-notes/$TAG.md" ]; then notes=(--notes-file "packaging/release-notes/$TAG.md"); fi
            gh release create "$TAG" "${files[@]}" --title "Parquetry $VERSION" "${notes[@]}" --verify-tag
          fi

      - name: Update Homebrew tap
        if: env.PUBLISH == 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN not set; skipping the Homebrew tap update"
            exit 0
          fi
          scripts/update-cask.sh "$VERSION" "target/dist/Parquetry-$VERSION.zip" target/dist/parquetry.rb
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 \
            "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/${GITHUB_OWNER}/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"
          cp target/dist/parquetry.rb "$TAP_DIR/Casks/parquetry.rb"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/parquetry.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
          else
            git commit -m "parquetry $VERSION"
            git push origin HEAD
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi

  windows:
    name: Windows build, zip, publish
    # After the macOS job (which creates the release when it runs), or on its own.
    needs: release
    if: always() && needs.release.result != 'failure' && needs.release.result != 'cancelled'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Tag pushes publish; manual runs only when asked to.
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Check tag matches Cargo.toml version
        run: |
          version="$(awk '/^\[/{s=($0=="[workspace.package]")} s&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked -p parquetry

      - name: Check the exe needs no Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\parquetry.exe
          $deps
          if ($deps -match 'VCRUNTIME|MSVCP|ucrtbase') { throw "parquetry.exe links the C runtime dynamically" }

      - name: Zip
        shell: pwsh
        run: |
          $name = "Parquetry-$env:VERSION-windows-x64"
          $stage = "target\dist\$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\parquetry.exe, LICENSE, README.md -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "target\dist\$name.zip" -Force
          $hash = (Get-FileHash "target\dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "target\dist\$name.zip.sha256" -Value "$hash  $name.zip" -NoNewline
          Get-Content "target\dist\$name.zip.sha256"

      - name: Keep the files (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parquetry-windows-${{ env.TAG }}
          path: target/dist/Parquetry-*-windows-x64.zip*
          retention-days: 7

      - name: Publish to the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(
            "target/dist/Parquetry-$VERSION-windows-x64.zip"
            "target/dist/Parquetry-$VERSION-windows-x64.zip.sha256"
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes=(--generate-notes)
            if [ -f "packaging/release-notes/$TAG.md" ]; then notes=(--notes-file "packaging/release-notes/$TAG.md"); fi
            gh release create "$TAG" "${files[@]}" --title "Parquetry $VERSION" "${notes[@]}" --verify-tag
          fi

      - name: Update Scoop bucket
        if: env.PUBLISH == 'true'
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "$SCOOP_BUCKET_TOKEN" ]; then
            echo "::warning::SCOOP_BUCKET_TOKEN not set; skipping the Scoop bucket update"
            exit 0
          fi
          BUCKET="$RUNNER_TEMP/scoop-bucket"
          git clone --depth 1 \
            "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/${GITHUB_OWNER}/scoop-bucket.git" "$BUCKET"
          scripts/update-scoop.sh "$VERSION" "target/dist/Parquetry-$VERSION-windows-x64.zip" "$BUCKET/bucket/parquetry.json"
          cd "$BUCKET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/parquetry.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date"
          else
            git commit -m "parquetry $VERSION"
            git push origin HEAD
          fi

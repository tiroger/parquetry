name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Generated notebooks and code run in real Python through uv.
  PARQUETRY_REQUIRE_PYTHON_TESTS: "1"

jobs:
  rust:
    name: Test & clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6
        with:
          # A pinned version skips the "latest release" lookup, which can time out.
          version: "0.12.3"

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows:
    name: Windows build & test
    runs-on: windows-latest
    # Without a cache (a new Cargo.lock, or main's first run) test, clippy and the
    # release build take ~2 h, and saving the cache comes after them.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The first MSVC build takes ~55 min; keep it even if a test fails.
          cache-on-failure: true

      - uses: astral-sh/setup-uv@v6
        with:
          # A pinned version skips the "latest release" lookup, which can time out.
          version: "0.12.3"

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --release --locked -p parquetry

      - name: Check the exe needs no Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\parquetry.exe
          $deps
          if ($deps -match 'VCRUNTIME|MSVCP|ucrtbase') { throw "parquetry.exe links the C runtime dynamically" }

      - uses: actions/upload-artifact@v4
        with:
          name: parquetry-windows-x64
          path: target/release/parquetry.exe
          retention-days: 14

  packaging:
    name: Packaging lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck packaging/bin/parquetry scripts/bundle.sh scripts/package.sh \
            scripts/notarize.sh scripts/update-cask.sh scripts/update-scoop.sh scripts/appcast.sh

      - name: Property lists
        run: plutil -lint packaging/Info.plist.template packaging/Parquetry.entitlements

      - name: Disk image settings
        run: python3 -m py_compile packaging/dmg/settings.py

      - name: Cask syntax
        run: ruby -c packaging/homebrew/parquetry.rb

      - name: Scoop manifest
        run: python3 -m json.tool packaging/scoop/parquetry.json > /dev/null

      - name: CLI launcher smoke test
        run: |
          touch sample.parquet
          out="$(DRY_RUN=1 packaging/bin/parquetry sample.parquet s3://bucket/key.parquet)"
          echo "$out"
          grep -q "open -b io.parquetry.app $PWD/sample.parquet" <<<"$out"
          grep -q 'parquetry://open\\?url=s3%3A%2F%2Fbucket%2Fkey.parquet' <<<"$out"
          if packaging/bin/parquetry does-not-exist.parquet 2>/dev/null; then exit 1; fi

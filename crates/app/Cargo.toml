[package]
name = "parquetry"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "parquetry"
path = "src/main.rs"

[dependencies]
parquetry-engine.workspace = true
parquetry-grid.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
log.workspace = true
dirs.workspace = true
parking_lot.workspace = true
futures.workspace = true

# The notebook window: the system web view (WKWebView, WebView2) in a GPUI window.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
wry = { version = "0.57", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSObject"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
duckdb.workspace = true
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
